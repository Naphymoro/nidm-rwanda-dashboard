[project]
name = "ndim-mcp"
version = "0.1.0"
description = "MCP server exposing the NDIM scientific engine to agent harnesses such as DeerFlow"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ndim-mcp = "ndim_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ndim_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
