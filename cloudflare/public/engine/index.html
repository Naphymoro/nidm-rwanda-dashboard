<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>NDIM · Research Studio</title>
<link rel="stylesheet" href="/engine/assets/chat.css">
<script>try{const t=localStorage.getItem('ndim-theme');if(t)document.documentElement.dataset.theme=t;}catch{}</script>
<script src="/engine/assets/engine-config.js"></script>
<script defer src="/engine/assets/chat.js"></script></head>
<body data-page="studio">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 19V5"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
<symbol id="i-paste" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.4L19 10l-5.2 1.7L12 17l-1.8-5.3L5 10l5.2-1.6z"/><path d="M19 17l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
<symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-spin" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-cap" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></symbol>
<symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></symbol>
<symbol id="i-resume" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="i-plug" viewBox="0 0 24 24"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-ext" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
<symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
</defs></svg>
<div class="app" id="app">
<aside class="sidebar" id="sidebar" aria-label="Chats">
  <div class="sb-head"><a class="brand" href="/engine/" data-route="studio"><span class="brand-mark">n<span>·</span></span><span>NDIM</span></a><button class="icon-btn" id="collapse" type="button" aria-label="Close sidebar" title="Close sidebar"><svg><use href="#i-panel"/></svg></button></div>
  <button class="sb-new" id="new-chat" type="button"><svg><use href="#i-plus"/></svg>New chat<kbd>N</kbd></button>
  <div class="sb-project"><label class="sb-label" for="workspace">Project</label><div class="sb-row"><select id="workspace"></select><button class="icon-btn" id="new-workspace" type="button" aria-label="New project" title="New project"><svg><use href="#i-plus"/></svg></button></div></div>
  <div class="threads" id="threads"><p class="sb-empty">No chats yet.</p></div>
  <div class="sb-foot">
    <button type="button" data-open-panel="workbench"><svg><use href="#i-flask"/></svg>Workbench</button>
    <button type="button" data-open-panel="library"><svg><use href="#i-book"/></svg>Library<small>Field manual · curriculum</small></button>
    <div class="engine"><i class="dot"></i><span id="engine-status">Connecting…</span></div>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>
<main class="main empty" id="main">
  <header class="topbar"><button class="icon-btn" id="menu" type="button" aria-label="Open sidebar" title="Open sidebar"><svg><use href="#i-panel"/></svg></button><h1 class="chat-title" id="chat-title">New chat</h1><span class="model-badge" id="model-badge" hidden></span><button class="icon-btn" id="panel-toggle" type="button" aria-label="Open workbench and library" title="Workbench and library" aria-expanded="false"><svg><use href="#i-side"/></svg></button><button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle light or dark theme" title="Toggle theme"><svg><use href="#i-moon"/></svg></button></header>
  <div class="scroller" id="scroller">
    <div class="welcome" id="welcome"><div class="welcome-mark" aria-hidden="true">n<span>·</span></div><h2 id="greeting">Hello</h2><p>What would you like to investigate?</p><div id="connect" hidden></div></div>
    <div class="thread" id="thread" aria-live="polite"></div>
  </div>
  <div class="composer-wrap">
    <form class="composer" id="composer" novalidate>
      <div class="attachments" id="attachments"></div>
      <div class="evidence-editor" id="evidence-editor" hidden>
        <label class="sr-only" for="evidence-input">Source evidence</label>
        <textarea id="evidence-input" rows="5" maxlength="20000" placeholder="Paste an interview excerpt, field note or other source material. Label synthetic examples clearly."></textarea>
        <div class="ee-row"><label class="sr-only" for="source-name">Source name</label><input id="source-name" maxlength="240" value="Researcher-supplied field note"><label class="sr-only" for="consent">Source permission</label><select id="consent"><option value="unconfirmed">Permission not yet confirmed</option><option value="research_use">Research use confirmed</option><option value="synthetic">Synthetic teaching example</option></select><span class="spacer"></span><button type="button" class="btn ghost" id="evidence-cancel">Cancel</button><button type="button" class="btn primary" id="evidence-save">Attach evidence</button></div>
      </div>
      <label class="sr-only" for="prompt">Message NDIM</label>
      <textarea id="prompt" rows="1" maxlength="1000" placeholder="Ask a research question…" autocomplete="off"></textarea>
      <div class="menu slash" id="slash-menu" role="listbox" aria-label="Skills" hidden></div>
      <div class="bar">
        <div class="anchor"><button type="button" class="icon-btn" id="attach-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Add evidence" title="Add evidence"><svg><use href="#i-plus"/></svg></button>
          <div class="menu" id="attach-menu" role="menu" hidden>
            <button type="button" role="menuitem" data-attach="file"><svg><use href="#i-clip"/></svg><span>Upload a text file<small>.txt or .md, up to 20,000 characters</small></span></button>
            <button type="button" role="menuitem" data-attach="paste"><svg><use href="#i-paste"/></svg><span>Paste evidence<small>Interview excerpt or field note</small></span></button>
            <button type="button" role="menuitem" data-attach="sample"><svg><use href="#i-file"/></svg><span>Use the sample field notes<small>Synthetic teaching example</small></span></button>
          </div></div>
        <div class="anchor"><button type="button" class="chip-btn" id="skill-btn" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-spark"/></svg><span id="skill-label">Auto</span><svg class="chev"><use href="#i-chev"/></svg></button>
          <div class="menu wide" id="skill-menu" role="menu" hidden></div></div>
        <div class="anchor"><button type="button" class="icon-btn" id="settings-btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Experiment settings" title="Experiment settings"><svg><use href="#i-sliders"/></svg></button>
          <div class="menu settings" id="settings-menu" role="dialog" aria-label="Experiment settings" hidden>
            <div id="ai-settings" class="ai-settings"></div>
            <div class="menu-title">Experiment settings<small>Defaults for new plans</small></div>
            <label>Model<select id="set-model"><option value="compartmental">S/M/T/I/R compartmental</option><option value="hybrid">Hybrid · compartmental + proxy</option><option value="agent_based">Agent-based proxy</option></select></label>
            <label>Compute<select id="set-profile"><option value="auto">Auto (measured)</option><option value="economy">Economy · 3 sweep points</option><option value="balanced">Balanced · 7 sweep points</option><option value="thorough">Thorough · 11 sweep points</option></select></label>
            <label>Intervention strength <output id="out-intervention">0.30</output><input id="set-intervention" type="range" min="0" max="1" step="0.01" value="0.3"></label>
            <label>Initial adoption <output id="out-initial">0.10</output><input id="set-initial" type="range" min="0" max="1" step="0.01" value="0.1"></label>
            <label>Narrative influence <output id="out-influence">0.38</output><input id="set-influence" type="range" min="0" max="1" step="0.01" value="0.38"></label>
            <label>Horizon (model days)<input id="set-horizon" type="number" min="7" max="365" value="90"></label>
            <label>Evidence language<select id="set-language"><option value="en">English</option><option value="rw">Kinyarwanda</option><option value="fr">French</option><option value="other">Other</option></select></label>
            <label>Explanations<select id="set-expertise"><option value="guided">Guided · plain language</option><option value="researcher">Researcher · methods</option><option value="expert">Expert · full audit</option></select></label>
            <label class="check"><input id="set-autorun" type="checkbox"> Run plans without asking</label>
            <p class="menu-note" id="capacity"></p>
          </div></div>
        <span class="spacer"></span>
        <button type="submit" class="send" id="send" aria-label="Send" title="Send (Enter)"><svg><use href="#i-send"/></svg></button>
      </div>
      <input type="file" id="file-input" accept=".txt,.md,text/plain,text/markdown" hidden>
    </form>
    <div class="suggestions" id="suggestions"></div>
    <p class="disclaimer">NDIM runs local scientific tools, not an AI model. Scores are heuristics and scenarios are illustrative, so check them against the evidence.</p>
  </div>
</main>
<aside class="panel" id="panel" hidden aria-label="Workbench and library">
  <div class="panel-head"><div class="tabs" role="tablist" aria-label="Panel"><button type="button" role="tab" id="tab-workbench" data-tab="workbench" aria-selected="true" aria-controls="panel-workbench">Workbench</button><button type="button" role="tab" id="tab-library" data-tab="library" aria-selected="false" aria-controls="panel-library">Library</button></div><button class="icon-btn" id="panel-close" type="button" aria-label="Close panel" title="Close panel"><svg><use href="#i-x"/></svg></button></div>
  <div class="panel-body" id="panel-workbench" role="tabpanel" aria-labelledby="tab-workbench"></div>
  <div class="panel-body" id="panel-library" role="tabpanel" aria-labelledby="tab-library" hidden></div>
</aside>
</div>
</body></html>
