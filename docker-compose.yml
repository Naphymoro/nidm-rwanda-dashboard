services:
  ndim-engine:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ndim-engine-local
    environment:
      NDIM_DESKTOP: "1"
      NDIM_DATA_DIR: /data
      NDIM_MAX_UPLOAD_MB: "50"
    ports:
      - "8010:8000"
    volumes:
      - ndim-data:/data
      - ./stress_test_corpus:/app/stress_test_corpus:ro
      - ./docs:/app/docs:ro
    restart: unless-stopped

volumes:
  ndim-data:
