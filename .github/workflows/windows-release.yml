name: Windows Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, for example 0.8.0-alpha.1"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            desktop/requirements-desktop.txt

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $version = "${{ github.ref_name }}".TrimStart("v")
            } else {
              $version = (Get-Content VERSION -Raw).Trim()
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r desktop/requirements-desktop.txt

      - name: Build release assets
        shell: pwsh
        run: |
          .\scripts\build_windows_release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ndim-engine-windows-${{ steps.version.outputs.version }}
          path: |
            dist/NDIM-Engine-Setup-${{ steps.version.outputs.version }}.exe
            dist/NDIM-Engine-Windows-Portable-${{ steps.version.outputs.version }}.zip
            RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: NDIM Engine ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          files: |
            dist/NDIM-Engine-Setup-${{ steps.version.outputs.version }}.exe
            dist/NDIM-Engine-Windows-Portable-${{ steps.version.outputs.version }}.zip
