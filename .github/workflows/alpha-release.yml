name: Cross-Platform Alpha Release

on:
  push:
    tags:
      - "v*-alpha*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, for example 0.9.0-alpha.5"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-alpha:
    name: Build alpha package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="$(cat VERSION)"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.lock.txt
            desktop/requirements-desktop.txt

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock.txt
          python -m pip install -r desktop/requirements-desktop.txt

      - name: Run offline smoke test
        run: python scripts/smoke_test.py

      - name: Build Windows alpha package
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build_windows_release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Build macOS alpha package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x scripts/build_desktop.sh scripts/package_macos_dmg.sh
          USE_VENV=1 ./scripts/build_desktop.sh --clean
          ./scripts/package_macos_dmg.sh "${{ steps.version.outputs.version }}"

      - name: Build Linux alpha package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/build_desktop.sh scripts/package_linux_deb.sh
          USE_VENV=1 ./scripts/build_desktop.sh --clean
          ./scripts/package_linux_deb.sh "${{ steps.version.outputs.version }}"

      - name: Upload alpha artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ndim-engine-alpha-${{ matrix.name }}-${{ steps.version.outputs.version }}
          path: |
            dist/NDIM-Engine-Setup-*.exe
            dist/NDIM-Engine-Windows-Portable-*.zip
            dist/NDIM-Engine-*.dmg
            dist/*.deb
            dist/SHA256SUMS.txt
            dist/ALPHA_TESTER_README.md
            dist/PACKAGE_NOTES.md
            dist/RELEASE_NOTES.md
          if-no-files-found: ignore

      - name: Publish alpha GitHub Release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: NDIM Engine ${{ github.ref_name }}
          body_path: docs/ALPHA_TESTER_README.md
          prerelease: true
          files: |
            dist/NDIM-Engine-Setup-*.exe
            dist/NDIM-Engine-Windows-Portable-*.zip
            dist/NDIM-Engine-*.dmg
            dist/*.deb
            dist/SHA256SUMS.txt
            dist/ALPHA_TESTER_README.md
            dist/PACKAGE_NOTES.md
            dist/RELEASE_NOTES.md
