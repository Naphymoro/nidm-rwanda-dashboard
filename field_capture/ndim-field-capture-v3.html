<style>

<script>
"use strict";
/* Storage (IndexedDB). No fallback: the tool refuses to collect data if it cannot persist it. */
let db = null;
function openDB(){
  return new Promise(res=>{
    try{
      const r = indexedDB.open("ndim_field_capture_v3", 1);
      r.onupgradeneeded = ()=>{
        const d = r.result;
        d.createObjectStore("kv");
        d.createObjectStore("records",{keyPath:"id"});
        const c = d.createObjectStore("clips",{keyPath:"clipId"}); c.createIndex("recordId","recordId");
        const ch = d.createObjectStore("chunks",{autoIncrement:true}); ch.createIndex("clipId","clipId");
      };
      r.onsuccess = ()=>{ db = r.result; res(true); };
      r.onerror = ()=>res(false);
      r.onblocked = ()=>res(false);
    }catch(e){ res(false); }
  });
}
function idb(store, mode, fn){
  return new Promise((res,rej)=>{
    let out;
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    if(req) req.onsuccess = ()=>{ out = req.result; };
    t.oncomplete = ()=>res(out);
    t.onerror = ()=>rej(t.error);
    t.onabort = ()=>rej(t.error || new Error("Transaction aborted"));
  });
}
const kvGet = k=>idb("kv","readonly",s=>s.get(k));
const kvSet = (k,v)=>idb("kv","readwrite",s=>s.put(v,k));
const recPut = r=>idb("records","readwrite",s=>s.put(r));
const recGet = id=>idb("records","readonly",s=>s.get(id));
const recAll = ()=>idb("records","readonly",s=>s.getAll());
const recDel = id=>idb("records","readwrite",s=>s.delete(id));
const clipPut = c=>idb("clips","readwrite",s=>s.put(c));
const clipGet = id=>idb("clips","readonly",s=>s.get(id));
const clipAll = ()=>idb("clips","readonly",s=>s.getAll());
const clipsFor = rid=>idb("clips","readonly",s=>s.index("recordId").getAll(rid));
const clipDel = id=>idb("clips","readwrite",s=>s.delete(id));
const chunkAdd = c=>idb("chunks","readwrite",s=>s.add(c));
async function chunksFor(clipId){
  return new Promise((res,rej)=>{
    const out=[]; const t=db.transaction("chunks","readonly");
    const cur=t.objectStore("chunks").index("clipId").openCursor(IDBKeyRange.only(clipId));
    cur.onsuccess=()=>{ const c=cur.result; if(c){ out.push({key:c.primaryKey, ...c.value}); c.continue(); } };
    t.oncomplete=()=>res(out.sort((a,b)=>a.seq-b.seq)); t.onerror=()=>rej(t.error);
  });
}
async function chunksDelete(keys){
  return idb("chunks","readwrite",s=>{ keys.forEach(k=>s.delete(k)); return null; });
}


/* Helpers */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function getPath(o,p){ return p.split(".").reduce((a,k)=>a==null?undefined:a[k],o); }
function setPath(o,p,v){ const ks=p.split("."); let a=o; ks.slice(0,-1).forEach(k=>{ if(a[k]==null||typeof a[k]!=="object") a[k]={}; a=a[k]; }); a[ks[ks.length-1]]=v; }
function nowISO(){ return new Date().toISOString(); }
function fmtTime(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function fmtBytes(b){ if(!b&&b!==0) return ""; if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(0)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
function toast(msg,ms=2600){ $$(".toast").forEach(x=>x.remove()); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }
function uid(){ return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); }
function clamp01(x){ const n=parseFloat(x); if(isNaN(n)) return null; return Math.min(1,Math.max(0,n)); }


/* Form binding */
function bindForm(root,obj,after){
  $$("[data-b]",root).forEach(el=>{
    const p=el.dataset.b; const v=getPath(obj,p);
    if(el.type==="checkbox"){ el.checked=Array.isArray(v)&&v.includes(el.value); }
    else if(el.type==="radio"){ el.checked=(v!=null&&String(v)===el.value); }
    else if(v!=null) el.value=v;
    const ev=(el.tagName==="SELECT"||el.type==="radio"||el.type==="checkbox")?"change":"input";
    el.addEventListener(ev,()=>{
      if(el.type==="checkbox"){ let arr=getPath(obj,p); if(!Array.isArray(arr)) arr=[]; arr=arr.filter(x=>x!==el.value); if(el.checked) arr.push(el.value); setPath(obj,p,arr); }
      else if(el.type==="radio"){ if(el.checked) setPath(obj,p,el.value); }
      else setPath(obj,p,el.value);
      if(after) after(p,el);
    });
  });
}
function field(label,path,opts={}){
  const hint=opts.hint?`<span class="hint">${esc(opts.hint)}</span>`:"";
  const id="f_"+path.replace(/\W/g,"_");
  if(opts.type==="textarea") return `<label for="${id}">${esc(label)}${hint}</label><textarea id="${id}" data-b="${path}" ${opts.rows?`rows="${opts.rows}"`:""}></textarea>`;
  if(opts.type==="select") return `<label for="${id}">${esc(label)}${hint}</label><select id="${id}" data-b="${path}"><option value="">Select</option>${opts.options.map(o=>`<option value="${esc(o.value??o)}">${esc(o.label??o)}</option>`).join("")}</select>`;
  return `<label for="${id}">${esc(label)}${hint}</label><input id="${id}" type="${opts.type||"text"}" data-b="${path}" ${opts.attrs||""}>`;
}
function choices(label,path,opts,type="checkbox",hint){
  const name="n_"+path.replace(/\W/g,"_")+"_"+uid();
  return `<fieldset style="border:0;padding:0;margin:.8rem 0 0"><legend style="font-weight:600;margin-bottom:.35rem">${esc(label)}${hint?`<span class="hint" style="display:block;font-weight:400;color:var(--muted);font-size:.9rem">${esc(hint)}</span>`:""}</legend><div class="choices">${opts.map(o=>`<label><input type="${type}" name="${name}" data-b="${path}" value="${esc(o)}">${esc(o)}</label>`).join("")}</div></fieldset>`;
}


/* ZIP (store method; audio is already compressed) */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function dosTime(d){ return { time:((d.getHours()<<11)|(d.getMinutes()<<5)|(Math.floor(d.getSeconds()/2)))&0xFFFF, date:(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF }; }
async function makeZip(files){
  const enc=new TextEncoder(); const parts=[]; const central=[]; let offset=0; const {time,date}=dosTime(new Date());
  for(const f of files){
    const name=enc.encode(f.name);
    const data=f.data instanceof Uint8Array?f.data:(typeof f.data==="string"?enc.encode(f.data):new Uint8Array(await f.data.arrayBuffer()));
    const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,time,true); lh.setUint16(12,date,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,time,true); ch.setUint16(14,date,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),name);
    offset+=30+name.length+data.length;
  }
  const cdSize=central.reduce((a,p)=>a+p.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:"application/zip"});
}
async function readZip(blob){
  const buf=new Uint8Array(await blob.arrayBuffer()); const dv=new DataView(buf.buffer); const dec=new TextDecoder();
  let e=-1; for(let i=buf.length-22;i>=Math.max(0,buf.length-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){ e=i; break; } }
  if(e<0) throw new Error("Not a ZIP file");
  const count=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const out={};
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error("Corrupt ZIP directory");
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nlen=dv.getUint16(p+28,true), xlen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=dec.decode(buf.subarray(p+46,p+46+nlen));
    if(method!==0) throw new Error("Only backups exported by this tool can be imported");
    const lnl=dv.getUint16(lho+26,true), lxl=dv.getUint16(lho+28,true); const start=lho+30+lnl+lxl;
    out[name]=buf.slice(start,start+csize);
    p+=46+nlen+xlen+clen;
  }
  return out;
}
async function sha256(blob){ try{ const h=await crypto.subtle.digest("SHA-256",await blob.arrayBuffer()); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join(""); }catch(e){ return null; } }

/* Study content                                                       */
/* ------------------------------------------------------------------ */
const APP_VERSION = "3.0.0";
const SCHEMA = "ndim-field-record/3.0";
const COUNTRY = "Rwanda", PROVINCE = "Kigali City", DISTRICT = "Kicukiro";
const SECTORS = ["Gahanga","Gatenga","Gikondo","Kagarama","Kanombe","Kicukiro","Kigarama","Masaka","Niboye","Nyarugunga"];

/* Engine structured_interview columns, in the exact order of the NDIM Engine sample file. */
const ENGINE_COLUMNS = ["narrative_id","evidence_mode","interview_id","country","province","district","sector","cell","village","respondent_profile","respondent_role","household_cooking_role","primary_decision_maker","current_cooking_methods","adoption_status","technology_focus","intervention_channel","source_type","source_name","period","language","consent_tier","visibility","reviewer","observation_date","location_precision","validation_status","community_validation","knowledge_type","knowledge_holder","sensitivity","attribution","contributor_type","citizen_confidence","feed_sources","platform","source_actor","trusted_messenger","perceived_harm_fear","indigenous_knowledge_status","q1","q2","q3","q4","q5","narrative","tone_archetype","adoption_stance","key_barrier","key_motivator","social_influence","translation_notes","benefit_sharing","manual_barrier_strength","trust_signal","misinformation_risk","inoculation_opportunity","emotional_intensity","credibility_local_grounding","expected_ndim_signal","collection_template"];
const TEMPLATE_ID = "climatetales-kicukiro-technology-neutral-q1-q5-v3";

/* Five technology-neutral questions. Rwandan detail sits in the probes, not the main prompt. */
const QUESTIONS = [
 { id:"q1", code:"Q1", title:"The last meal", role:"Trigger story",
   prompt:"Think about the last time you cooked the main meal for your household. Walk me through it, from getting the fire or stove ready to serving the food.",
   probes:["What did you cook, and on what? (for example beans, umutsima, isombe, igitoki, rice)","How long did it take, especially the beans?","Where did you cook: inside the house, a separate kitchen, or outside?","Who was near you while you cooked, and were children close by?","What did the fuel cost you that day, in money or in time: charcoal, firewood, gas, or electricity tokens?","Did you use more than one stove or fuel for this meal? Why?"],
   purpose:"Grounds the interview in today's practice without judgement. Establishes current methods, stacking and the everyday burden of cooking.",
   feeds:"current_cooking_methods, adoption_status; barrier pressure (B)." },
 { id:"q2", code:"Q2", title:"The first time", role:"Change exposure",
   prompt:"Tell me about the first time you saw or heard about a way of cooking different from the one you use. What happened, and what went through your mind?",
   probes:["What was it: an improved stove, gas, electric cooking, biogas, or something else?","Where were you, and who showed or told you? (a neighbour, a health worker, a vendor, the radio, a meeting such as umugoroba w'ababyeyi or inteko z'abaturage)","How long ago was that?","What did you feel in that moment?","What did you understand about how it works and what it costs?","Have you heard about it again since then, and from where?"],
   purpose:"Captures first exposure, which technology, the channel and messenger, and the emotional charge of the encounter. If the person has never heard of any alternative, record that: it is data.",
   feeds:"intervention_channel, technology_focus; exposure (E)." },
 { id:"q3", code:"Q3", title:"What people say", role:"Social influence and competing narratives",
   prompt:"What do people around you say about new ways of cooking? Tell me about one story or conversation that stayed with you, good or bad.",
   probes:["Who told it, and do you trust that person on this subject?","Did you believe it?","Which parts feel true, and which feel exaggerated?","Have you ever repeated this story to someone else?","Have you heard stories about safety, cost, or the taste of the food?","Is there a story that says the opposite?"],
   purpose:"Harvests the narratives in circulation, including fears and rumours, with who carries them and whether they are believed or passed on.",

/* ------------------------------------------------------------------ */
/* Continuous recorder with question markers                          */
/* One interview = one or more audio parts. Moving between questions  */
/* while recording drops a marker at the current offset.              */
/* ------------------------------------------------------------------ */
const Rec = { mr:null, stream:null, clipId:null, recordId:null, t0:0, acc:0, paused:false, tick:null, ctx:null, an:null, raf:null, wake:null, pending:Promise.resolve() };
function pickMime(){
  if(!window.MediaRecorder) return null;
  for(const m of ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"]){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return "";
}
function extFor(mime){ if(!mime) return "webm"; if(mime.includes("mp4")) return "m4a"; if(mime.includes("ogg")) return "ogg"; return "webm"; }
function isRecording(){ return !!(Rec.mr && Rec.mr.state!=="inactive"); }
function elapsed(){ return Rec.acc + (Rec.paused||!Rec.t0 ? 0 : Date.now()-Rec.t0); }

function addMarker(type,step,label){
  if(!isRecording()||!App.rec) return;
  App.rec.markers=App.rec.markers||[];
  App.rec.markers.push({type, step, label:label||"", clipId:Rec.clipId, part:Rec.part, offsetMs:elapsed(), at:nowISO()});
  scheduleSave();
}
async function startRecording(){
  if(isRecording()) return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){ toast("This browser cannot record audio. Use current Chrome.",6000); return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ toast("Microphone not available: "+e.message,6000); return; }
  const mime=pickMime(); let mr;
  try{ mr=new MediaRecorder(stream, mime?{mimeType:mime,audioBitsPerSecond:64000}:undefined); }catch(e){ mr=new MediaRecorder(stream); }
  const rid=App.rec.id;
  const part=(await clipsFor(rid)).length+1;
  const clipId=`${rid}_P${part}_${Date.now().toString(36)}`;
  await clipPut({clipId, recordId:rid, part, mime:mr.mimeType||mime||"audio/webm", startedAt:nowISO(), durationMs:0, finalized:false});
  Object.assign(Rec,{mr,stream,clipId,recordId:rid,part,t0:Date.now(),acc:0,paused:false,pending:Promise.resolve()});
  let seq=0;
  mr.ondataavailable=e=>{ if(e.data&&e.data.size){ const blob=e.data,n=seq++; Rec.pending=Rec.pending.then(()=>chunkAdd({clipId,seq:n,blob})).catch(err=>toast("Audio save failed: "+err.message,6000)); } };
  mr.onstop=()=>{ const dur=elapsed(); Rec.pending.then(()=>finalizeClip(clipId,dur)).then(()=>renderRecBar()); };
  mr.start(4000);
  if(!App.rec.timing.firstRecordingAt){ App.rec.timing.firstRecordingAt=nowISO(); }
  const step=STEPS[App.step]; if(MARKED_STEPS.includes(step)) addMarker("question",step);
  try{ if("wakeLock" in navigator) Rec.wake=await navigator.wakeLock.request("screen"); }catch(e){}
  try{
    const AC=window.AudioContext||window.webkitAudioContext; Rec.ctx=new AC();
    const src=Rec.ctx.createMediaStreamSource(stream); Rec.an=Rec.ctx.createAnalyser(); Rec.an.fftSize=1024; src.connect(Rec.an);
    const buf=new Float32Array(Rec.an.fftSize);
    const draw=()=>{ if(!Rec.an) return; Rec.an.getFloatTimeDomainData(buf); let s=0; for(const v of buf) s+=v*v; const rms=Math.sqrt(s/buf.length);
      const m=$("#meter i"); if(m) m.style.width=Math.min(100,Math.round(rms*400))+"%"; Rec.raf=requestAnimationFrame(draw); };
    draw();
  }catch(e){}
  Rec.tick=setInterval(()=>{ const t=$("#rectimer"); if(t) t.textContent=fmtTime(elapsed()); },250);
  scheduleSave(); renderRecBar();
}
function pauseResume(){
  if(!isRecording()) return;
  if(Rec.mr.state==="recording"){ Rec.mr.pause(); Rec.acc+=Date.now()-Rec.t0; Rec.paused=true; }
  else if(Rec.mr.state==="paused"){ Rec.mr.resume(); Rec.t0=Date.now(); Rec.paused=false; }
  renderRecBar();
}
function stopRecording(){
  if(!isRecording()) return;
  Rec.mr.stop(); Rec.stream.getTracks().forEach(t=>t.stop());
  clearInterval(Rec.tick); cancelAnimationFrame(Rec.raf); Rec.an=null;
  try{ Rec.ctx&&Rec.ctx.close(); }catch(e){}
  try{ Rec.wake&&Rec.wake.release(); }catch(e){}
  Rec.wake=null; renderRecBar();
}
async function finalizeClip(clipId,durationMs,recovered){
  const clip=await clipGet(clipId); if(!clip) return;
  const parts=await chunksFor(clipId);
  if(!parts.length){ await clipDel(clipId); if(Rec.clipId===clipId){ Rec.mr=null; Rec.clipId=null; } return; }
  const blob=new Blob(parts.map(p=>p.blob),{type:clip.mime.split(";")[0]});
  clip.blob=blob; clip.sizeBytes=blob.size; clip.durationMs=durationMs||clip.durationMs||(recovered?parts.length*4000:0);
  clip.finalized=true; clip.endedAt=nowISO(); if(recovered){ clip.recovered=true; clip.durationApprox=true; }
  await clipPut(clip); await chunksDelete(parts.map(p=>p.key));
  if(Rec.clipId===clipId){ Rec.mr=null; Rec.clipId=null; }
}
async function recoverOrphans(){
  const clips=await clipAll(); let n=0;
  for(const c of clips){ if(!c.finalized){ await finalizeClip(c.clipId,c.durationMs,true); n++; } }
  if(n) toast(`Recovered ${n} interrupted recording(s). Note it in the field notes.`,7000);
}
window.addEventListener("beforeunload",e=>{ if(isRecording()){ e.preventDefault(); e.returnValue=""; } });

async function renderRecBar(){
  const p=$("#recbar"); if(!p||!App.rec) return;
  const parts=(await clipsFor(App.rec.id)).sort((a,b)=>a.part-b.part);
  const live=isRecording()&&Rec.recordId===App.rec.id, paused=live&&Rec.paused;
  const marks=(App.rec.markers||[]);
  p.innerHTML=`<div class="row" style="margin:0">
    <span class="recstate ${live&&!paused?"live":""}">${live?(paused?"Paused":"Recording"):(parts.length?"Stopped":"Not recording")}</span>
    <span class="timer" id="rectimer">${live?fmtTime(elapsed()):"00:00"}</span><span class="spacer"></span>
    ${live?`<button class="btn sec" id="rMark">Mark key moment</button><button class="btn sec" id="rPause">${paused?"Resume":"Pause"}</button><button class="btn rec" id="rStop">Stop</button>`
          :`<button class="btn rec" id="rStart">${parts.length?"Start new part":"Start recording"}</button>`}
  </div>
  <div class="meter" id="meter" aria-hidden="true"><i></i></div>
  <details><summary class="muted">${parts.length} part(s), ${marks.filter(m=>m.type==="question").length} question marker(s), ${marks.filter(m=>m.type==="moment").length} key moment(s)</summary>
   ${parts.length?`<ul class="takes">${parts.map(t=>`<li><strong>Part ${t.part}</strong><span class="muted">${t.blob?`${t.durationApprox?"about ":""}${fmtTime(t.durationMs||0)}, ${fmtBytes(t.sizeBytes)}${t.recovered?", recovered after interruption":""}`:(live&&t.clipId===Rec.clipId?"in progress":"saving")}</span>${t.blob?`<audio controls preload="none" data-clip="${esc(t.clipId)}"></audio>`:""}</li>`).join("")}</ul>`:""}
   ${marks.length?`<ul class="takes">${marks.map(m=>`<li><span class="pill">${esc(m.type==="question"?STEP_LABEL[m.step]:"moment")}</span><span class="muted">part ${m.part}, ${fmtTime(m.offsetMs)}${m.label?", "+esc(m.label):""}</span></li>`).join("")}</ul>`:""}
  </details>`;
  $("#rStart")&&$("#rStart").addEventListener("click",startRecording);
  $("#rPause")&&$("#rPause").addEventListener("click",pauseResume);
  $("#rStop")&&$("#rStop").addEventListener("click",stopRecording);
  $("#rMark")&&$("#rMark").addEventListener("click",()=>{ const l=prompt("Short label for this moment (optional), e.g. proverb, strong quote, rumour"); if(l!==null){ addMarker("moment",STEPS[App.step],l); toast("Moment marked at "+fmtTime(elapsed())); renderRecBar(); } });
  $$("audio[data-clip]",p).forEach(a=>{ const t=parts.find(x=>x.clipId===a.dataset.clip); if(t&&t.blob) a.src=URL.createObjectURL(t.blob); });
  const exit=$("#btnExit"); if(exit) exit.disabled=live;
}

async function withdraw(id){

  ${step!=="consent"&&!audioOK&&r.consent.obtained==="Yes"?`<div class="banner bad">Audio not permitted for this participant. Write as close to their words as you can.</div>`:""}
  <div id="stepbody">${body}</div>
  <div class="row"><button class="btn sec" id="btnBack" ${App.step===0?"disabled":""}>Back</button><button class="btn sec" id="btnExit">Save and exit</button><span class="spacer"></span>
  <button class="btn" id="btnNext">${step==="coding"?"Finish interview":"Next"}</button></div>`;
  bindForm($("#stepbody"),r,(p)=>{ scheduleSave(); if(p.startsWith("consent.")) updateConsentGate(); });
  if(step==="consent") updateConsentGate();
  if($("#recbar")) await renderRecBar();
  $("#btnBack").addEventListener("click",()=>goTo(App.step-1));
  $("#btnNext").addEventListener("click",()=>next());
  $("#btnExit").addEventListener("click",async()=>{ if(isRecording()){ toast("Stop the recording first."); return; } await saveNow(); setView("records"); });
  $$(".stepbtn").forEach(b=>b.addEventListener("click",()=>{ const i=+b.dataset.step; if(i<=App.step||r.status!=="draft") goTo(i); else toast("Use Next to move forward so the checks run."); }));
  window.scrollTo(0,0);
}
async function goTo(i){
  i=Math.max(0,Math.min(STEPS.length-1,i));
  if(i===App.step) return;
  if(STEPS[i]==="consent"&&isRecording()){ toast("Stop the recording before returning to consent."); return; }
  App.step=i;
  const step=STEPS[i]; if(isRecording()&&MARKED_STEPS.includes(step)) addMarker("question",step);
  await saveNow(); renderInterview($("#main"));
}
async function next(){
  const r=App.rec; const step=STEPS[App.step];
  if(step==="consent"){
    if(r.consent.obtained==="No"){ r.status="declined"; r.consent.declinedAt=nowISO(); await saveNow(); toast("Recorded as declined. Thank the person and leave."); setView("records"); return; }
    const miss=consentMissing(r); if(miss){ toast(miss,5000); return; }
  }
  if(step==="context"){
    const need=[["context.quota","sampling category"],["context.cell","cell"],["context.gender","gender"],["context.ageRange","age range"],["context.recruitment","recruitment route"],["context.respondentRole","respondent role"],["context.adoption","adoption status"]].filter(([p])=>!getPath(r,p));
    if(need.length){ toast("Please complete: "+need.map(x=>x[1]).join(", "),5000); return; }
    if(!r.timing.startedAt) r.timing.startedAt=nowISO();
    if(r.consent.audio==="Yes"&&!isRecording()&&!(await clipsFor(r.id)).length) toast("Reminder: start the recording before Q1.",4000);
  }
  if(step==="closing"&&!r.timing.endedAt) r.timing.endedAt=nowISO();
  if(step==="coding"){
    if(isRecording()){ toast("Stop the recording before finishing."); return; }
    const need=[["coding.stance","adoption stance"],["coding.technology","main technology discussed"],["coding.barrier","key barrier"],["coding.socialInfluence","social influence"]].filter(([p])=>!getPath(r,p));
    if(need.length){ toast("Please complete: "+need.map(x=>x[1]).join(", "),5000); return; }
    if(r.status==="draft"){ r.status="interviewed"; r.completedAt=nowISO(); }
    await saveNow(); toast("Interview saved. Add any missing English summaries from the audio before supervisor review.",5000); setView("records"); return;
  }
  goTo(App.step+1);
}
function consentMissing(r){
  const c=r.consent;
  if(c.read!=="Yes") return "Read the full consent statement to the participant first.";
  if(c.obtained!=="Yes") return "Consent must be recorded as Yes to continue.";
  if(!c.type) return "Record the consent type (written or verbal witnessed).";
  if(c.type==="Verbal (witnessed)"&&!c.witness) return "Enter the witness name or ID for verbal consent.";
  if(!c.language) return "Record the consent language.";
  if(!c.audio) return "Record whether audio recording is allowed.";
  if(!c.reuse) return "Record the level of reuse the participant agreed to.";
  if(!c.ref) return "Enter the consent form or signature reference.";
  return "";
}

}

/* ---------- Protocol ---------- */
function renderProtocol(m){
  const s=App.settings;
  m.innerHTML=`<h1>How this tool works</h1>
  <h2>1. The logic in one paragraph</h2>
  <p>The NDIM Engine needs, for each interview, five short stories (Q1 to Q5) plus who told them, where, and a few codes. It turns each story into a record, scores it on E, C, τ, κ, B and S, and uses those scores to move people between the S, M, T, I and R states of the model. This tool's only job is to collect those stories well, keep the audio as evidence, and hand the engine one clean row per interview. Scoring happens in the engine, not here.</p>
  <h2>2. From interview to model</h2>
  <ol>
   <li>Interview on the device, offline: consent, context, Q1 to Q5 with one continuous recording, closing, coding.</li>
   <li>Same day or later: complete the English summary for each question from the audio.</li>
   <li>Supervisor review: listen to a sample, confirm, mark as reviewed.</li>
   <li>Export each evening. The ZIP contains the engine import file and the audio.</li>
   <li>In the NDIM Engine (ClimateTales Rwanda workspace), choose the Structured interview route and open <code>engine/ndim_structured_interview_en.csv</code>. The engine creates five records per interview (q1 to q5), which go through the evidence gate, then encoding and modelling.</li>
  </ol>
  <h2>3. Why the questions are technology-neutral</h2>
  <p>The research permit covers improved cookstoves, biogas and waste-to-energy, and most Rwandan households still cook with firewood or charcoal, with improved biomass stoves making up most of what has been distributed. Naming one technology in the main questions would lead the answers. So the main prompts stay open, the participant names the technology, and the enumerator codes which technology each story is about. The data then shows which technologies carry the strongest stories, fears and trust in the sector.</p>
  <h2>4. Where Rwandan cooking culture enters</h2>
  <p>In the probes (dishes such as ibishyimbo, umutsima and isombe; cooking for guests; power cuts; Cash Power tokens; gas refills; savings groups), in the answer lists (imbabura, three-stone fire, improved stoves, LPG, electric, biogas, pellets), and in the messengers and channels (abajyanama b'ubuzima, ibimina, umugoroba w'ababyeyi, inteko z'abaturage, Umuganda, radio, church, vendor demonstrations). Probes are used only when a story stalls.</p>
  <h3>Terms to keep in the participant's words</h3>
  <p class="muted">Check spellings and meanings with the project translator before fieldwork.</p>
  <div class="scroll"><table><thead><tr><th>Term</th><th>Meaning</th></tr></thead><tbody>${GLOSSARY.map(([a,b])=>`<tr><td><strong>${esc(a)}</strong></td><td>${esc(b)}</td></tr>`).join("")}</tbody></table></div>
  <h2>5. The five questions and what each feeds</h2>
  ${QUESTIONS.map(q=>`<div class="qcard"><div class="q">${esc(q.code)}. ${esc(q.title)} (${esc(q.role)})</div><p>${esc(q.prompt)}</p><p class="muted"><strong>Probes:</strong> ${esc(q.probes.join(" "))}</p><p class="muted"><strong>Purpose:</strong> ${esc(q.purpose)}</p><p class="muted"><strong>Feeds:</strong> ${esc(q.feeds)}</p></div>`).join("")}
  <div class="qcard"><div class="q">Closing</div><p>${esc(CLOSING_PROMPT)}</p><p class="muted">Keeps stories and topics the team did not anticipate. Exported to the engine's narrative column.</p></div>
  <h2>6. Sample</h2>
  <p>One sector of ${DISTRICT} District${s.sector?`, currently <strong>${esc(s.sector)}</strong>`:""}, across about three cells. Target 30 interviews within the permit's 20 to 30; after 24, stop when three consecutive interviews add no new story. Recruit through several routes, not only leaders, and interview men and women separately.</p>
  <div class="scroll"><table><thead><tr><th>Category</th><th>Target</th></tr></thead><tbody>${s.quotas.map(q=>`<tr><td>${esc(q.label)}</td><td>${esc(q.target)}</td></tr>`).join("")}</tbody></table></div>
  <h2>7. Recording</h2>
  <p>After consent, start one recording and let it run through all five questions. Moving to the next question drops a marker at that point in the audio, so the transcriber can find each answer. Use "Mark key moment" for a proverb, a strong line or a rumour. Pause if the participant needs a break. Audio is saved every 4 seconds; if the browser closes, the recording is recovered when the tool reopens. Keep a second device recording the whole session as backup. Place the device 30 to 50 cm from the speaker on a cloth, away from radios and animals.</p>
  <h2>8. What the export contains</h2>
  <p><code>engine/ndim_structured_interview_en.csv</code>: one row per interview in the exact NDIM Engine column order, with q1 to q5 holding the English summaries, plus a final <code>collection_template</code> column that the engine reads, so records carry this technology-neutral protocol label instead of the default pressure-cooker template. <code>engine/ndim_structured_interview_rw.csv</code>: the same rows with the participant's own words, for Kinyarwanda analysis. Also: records.json (everything collected), markers.csv (question timings in the audio), clips.json (audio details and checksums), withdrawals.json, and the audio files. Consent maps to the engine tiers as follows: research only is <code>restricted</code>; community playback or public campaign use is <code>research_use</code>.</p>
  <h2>9. Data protection</h2>
  <p>Voice is personal data under Rwanda's data protection law. Data stay on this device until exported, and exports go only to AIMS-controlled storage in Rwanda. Use a device with a screen lock and encryption; never send files by WhatsApp or email. Withdrawal deletes the record and audio from the device and keeps only an ID and date, exported so the same record can be deleted at AIMS.</p>`;
}

    primary_decision_maker:c.decisionMaker||"", current_cooking_methods:(c.methods||[]).join("; "),
    adoption_status:c.adoption||"", technology_focus:k.technology||"", intervention_channel:k.channel||"",
    source_type:"interview", source_name:"enumerator_q1_q5", period:(c.date||"").slice(0,4)||"2026",
    language:lang==="rw"?(r.consent.language||"Kinyarwanda"):"English",
    consent_tier:consentTier(r), visibility:"project_team", reviewer:(r.review&&r.review.reviewer)||"",
    observation_date:c.date||"", location_precision:"sector",
    validation_status:r.status==="reviewed"?"field reviewed":"pending community validation", community_validation:"pending",
    knowledge_type:"", knowledge_holder:"", sensitivity:k.sensitivity||"ordinary", attribution:"anonymous", contributor_type:"enumerator",
    citizen_confidence:"", feed_sources:"", platform:"", source_actor:"", trusted_messenger:k.messenger||"", perceived_harm_fear:k.harm||"",
    indigenous_knowledge_status:"",
    q1:text("q1"), q2:text("q2"), q3:text("q3"), q4:text("q4"), q5:text("q5"),
    narrative:lang==="rw"?(r.closing.verbatim||""):(r.closing.summary||""),
    tone_archetype:k.tone||"", adoption_stance:k.stance||"", key_barrier:k.barrier||"", key_motivator:k.motivator||"", social_influence:k.socialInfluence||"",
    translation_notes:[k.translationNotes,terms].filter(Boolean).join(" | "),
    benefit_sharing:(r.closing.reciprocity||[]).join("; "),
    manual_barrier_strength:"", trust_signal:"", misinformation_risk:"", inoculation_opportunity:"", emotional_intensity:"", credibility_local_grounding:"", expected_ndim_signal:"", collection_template:TEMPLATE_ID
  };
}
function download(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000); }
async function exportZip(onlyId){
  if(isRecording()){ toast("Stop the recording first."); return; }
  let recs=await recAll(); if(onlyId) recs=recs.filter(r=>r.id===onlyId);
  if(!recs.length){ toast("Nothing to export."); return; }
  toast("Preparing export...");
  const ids=new Set(recs.map(r=>r.id));
  const clips=(await clipAll()).filter(c=>ids.has(c.recordId)&&c.blob);
  const files=[], clipMeta=[];
  for(const c of clips){
    const name=`audio/${c.recordId}_part${c.part}.${extFor(c.mime)}`;
    clipMeta.push({clipId:c.clipId,recordId:c.recordId,part:c.part,mime:c.mime,startedAt:c.startedAt,endedAt:c.endedAt,durationMs:c.durationMs,durationApprox:!!c.durationApprox,sizeBytes:c.sizeBytes,recovered:!!c.recovered,file:name,sha256:await sha256(c.blob)});
    files.push({name,data:c.blob});
  }
  const complete=recs.filter(r=>r.status==="interviewed"||r.status==="reviewed");
  const markerRows=recs.flatMap(r=>(r.markers||[]).map(m=>({record_id:r.id,type:m.type,step:m.step,label:m.label,part:m.part,offset:fmtTime(m.offsetMs),offset_ms:m.offsetMs,file:(clipMeta.find(c=>c.clipId===m.clipId)||{}).file||""})));
  const missing=complete.filter(r=>summariesDone(r)<5).map(r=>r.id);
  const withdrawals=(await kvGet("withdrawals"))||[];
  const meta={exportedAt:nowISO(),appVersion:APP_VERSION,schema:SCHEMA,deviceId:App.settings.deviceId,studyId:App.settings.studyId,protocolVersion:App.settings.protocolVersion,records:recs.length,engineRows:complete.length,declined:recs.filter(r=>r.status==="declined").length,audioParts:clips.length,recordsMissingEnglishSummaries:missing};
  files.unshift(
    {name:"README.txt",data:`NDIM field capture export\nStudy: ${meta.studyId}\nDevice: ${meta.deviceId}\nExported: ${meta.exportedAt}\nRecords: ${meta.records} (engine rows: ${meta.engineRows}, declined: ${meta.declined})\nAudio parts: ${meta.audioParts}\n${missing.length?`English summaries incomplete for: ${missing.join(", ")}. Complete them before importing the _en file.\n`:""}\nImport engine/ndim_structured_interview_en.csv into the NDIM Engine using the Structured interview route.\nContains personal data (voice). Store only on AIMS-controlled encrypted storage.\n`},
    {name:"export.json",data:JSON.stringify(meta,null,2)},
    {name:"engine/ndim_structured_interview_en.csv",data:toCSV(ENGINE_COLUMNS,complete.map(r=>engineRow(r,"en")),false)},
    {name:"engine/ndim_structured_interview_rw.csv",data:toCSV(ENGINE_COLUMNS,complete.map(r=>engineRow(r,"rw")),false)},
    {name:"records.json",data:JSON.stringify(recs,null,2)},
    {name:"markers.csv",data:toCSV(["record_id","type","step","label","part","offset","offset_ms","file"],markerRows,true)},
    {name:"clips.json",data:JSON.stringify(clipMeta,null,2)},
    {name:"withdrawals.json",data:JSON.stringify(withdrawals,null,2)}
  );
  try{
    const zip=await makeZip(files);
    const stamp=new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
    download(zip,`ndim_${App.settings.deviceId}_${onlyId||"all"}_${stamp}.zip`);
    const log=(await kvGet("exports"))||[]; log.push({at:nowISO(),records:recs.length,parts:clips.length,bytes:zip.size}); await kvSet("exports",log);
    toast(`Export ready: ${recs.length} record(s), ${clips.length} audio part(s), ${fmtBytes(zip.size)}.${missing.length?" Some English summaries are missing.":""}`,6000);
  }catch(e){ toast("Export failed: "+e.message,6000); }
}
async function importZip(file){
  try{
    const z=await readZip(file); const dec=new TextDecoder();
    if(!z["records.json"]) throw new Error("records.json missing");
    const recs=JSON.parse(dec.decode(z["records.json"])); const clips=z["clips.json"]?JSON.parse(dec.decode(z["clips.json"])):[];
    let nr=0,nc=0,sk=0;
    for(const r of recs){ const ex=await recGet(r.id); if(!ex||(r.updatedAt||"")>(ex.updatedAt||"")){ await recPut(r); nr++; } else sk++; }
    for(const c of clips){ if(await clipGet(c.clipId)) continue; const bytes=z[c.file]; if(!bytes) continue;
      const blob=new Blob([bytes],{type:(c.mime||"audio/webm").split(";")[0]});
      await clipPut({...c,sizeBytes:blob.size,finalized:true,blob}); nc++; }
    toast(`Imported ${nr} record(s) and ${nc} audio part(s). ${sk} already up to date.`,5000); render();
  }catch(e){ toast("Import failed: "+e.message,6000); }
}

/* ------------------------------------------------------------------ */
(async function boot(){
  $$("nav.tabs button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
  const ok=await openDB();
  if(!ok){ $("#main").innerHTML=`<div class="banner bad"><strong>Storage is unavailable on this browser.</strong> Do not collect data on this device. Open the file in current Chrome, outside private or incognito mode.</div>`; return; }
  const saved=await kvGet("settings");
  App.settings=Object.assign(defaultSettings(),saved||{});
  App.settings.promptsRw=Object.assign(defaultSettings().promptsRw,App.settings.promptsRw||{});
  if(!saved) await kvSet("settings",App.settings);
  await recoverOrphans();
  setView(setupComplete()?"records":"setup");
})();
